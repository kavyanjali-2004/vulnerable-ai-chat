name: DevSecOps AI Security Pipeline

on: [push]

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gate 1 - Bandit SAST Scan
        run: |
          pip install bandit
          bandit -r . -ll -ii

      - name: Gate 2 - Safety Dependency Check
        run: |
          pip install safety
          safety check || true

      - name: Gate 3 - Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate 4 - Custom Prompt Injection Scanner
        run: |
          python -c '
          import os, sys
          patterns = ["SYSTEM_PROMPT", "system_message", "ignore previous instructions"]
          found = False
          for root, dirs, files in os.walk("."):
              if ".github" in root or ".git" in root: continue
              for file in files:
                  if file.endswith(".py"):
                      with open(os.path.join(root, file), "r", encoding="utf-8") as f:
                          if any(p in f.read() for p in patterns): found = True
          if found: sys.exit(1)
          print("Custom Gate Passed!")
          '
