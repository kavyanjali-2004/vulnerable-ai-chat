<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TechCorp Internal AI Assistant</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f4f4; padding:40px; }
  .chat-box { max-width:600px; margin:0 auto; background:#fff; border:1px solid #ccc; padding:20px; }
  h2 { margin-top:0; }
  #messages { height:300px; overflow-y:auto; border:1px solid #ddd; padding:10px; margin-bottom:10px; background:#fafafa; }
  .msg-user { color:#000; margin:6px 0; }
  .msg-ai { color:#0a7d2c; margin:6px 0; white-space:pre-wrap; }
  input[type=text] { width:78%; padding:8px; }
  button { padding:8px 16px; background:#1a73e8; color:#fff; border:none; cursor:pointer; }
</style>
</head>
<body>
<div class="chat-box">
  <h2>TechCorp AI Assistant (Vulnerable)</h2>
  <div id="messages"></div>
  <input type="text" id="userInput" placeholder="Type your message here...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");
  const text = input.value;
  if (!text) return;

  messages.innerHTML += `<div class="msg-user">You: ${text}</div>`;
  input.value = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text})
  });
  const data = await res.json();

  // VULNERABLE: response injected directly into the DOM with no escaping
  messages.innerHTML += `<div class="msg-ai">AI: ${data.reply}</div>`;
  messages.scrollTop = messages.scrollHeight;
}
</script>
</body>
</html>
